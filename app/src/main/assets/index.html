<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>晴芽 · SunnySprout</title><style>
:root{--ink:#294b40;--muted:#7b8c80;--green:#438b69;--cream:#faf8f1;--line:#e9e9df}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:system-ui,-apple-system,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0;color:inherit}button:focus-visible{outline:3px solid #f0b75d}button:active{transform:scale(.97)}#app{max-width:760px;margin:auto;padding:26px 22px 115px}.brand{display:flex;justify-content:space-between;align-items:center}.logo{font-size:24px;font-weight:850;letter-spacing:2px}.eyebrow{font-size:11px;letter-spacing:3px;color:var(--muted);margin:6px 0 18px}.date{font-size:12px;background:white;border:1px solid var(--line);border-radius:20px;padding:10px 13px}h1{font-size:30px;letter-spacing:-1px;margin:22px 0 8px}h2{font-size:18px;margin:25px 0 16px}p{line-height:1.7}.sub{font-size:13px;color:var(--muted);margin:0}.hero{margin-top:24px;border-radius:28px;background:#e1eedb;padding:22px;position:relative;overflow:hidden;min-height:185px}.hero h2{font-size:21px;margin:0 0 8px;width:65%;line-height:1.4}.hero p{width:60%;font-size:12px}.mascot{position:absolute;right:2px;bottom:0;width:160px;height:160px}.pill{border-radius:24px;background:white;padding:10px 15px;font-size:12px;font-weight:700;display:inline-block}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}.stat{background:#fff;border:1px solid var(--line);border-radius:20px;padding:15px 10px;text-align:center}.stat b{display:block;font-size:25px}.stat span{font-size:11px;color:var(--muted)}.link{background:transparent;font-size:13px;color:var(--green);padding:9px}.habit{background:white;border:1px solid var(--line);border-radius:23px;padding:18px;margin:12px 0}.emoji{border-radius:17px;width:48px;height:48px;display:grid;place-items:center;font-size:25px;background:#f7ecd9;flex-shrink:0}.habit-title{font-size:16px;font-weight:750}.meta{font-size:11px;color:var(--muted);margin-top:5px}.check{height:43px;width:43px;border-radius:50%;background:#f2f5ec;font-size:23px;flex-shrink:0}.checked{background:var(--green);color:white}.week{display:flex;gap:7px;margin:18px 0 2px}.day{flex:1;text-align:center;font-size:10px;color:var(--muted)}.dot{width:100%;max-width:38px;height:28px;background:#f0f3eb;border-radius:8px;display:grid;place-items:center;margin:5px auto;color:var(--green);font-size:12px}.done{background:#cde4ba}.quote{padding:18px;color:var(--muted);text-align:center;font-size:12px}.nav{position:fixed;bottom:0;left:0;right:0;padding:12px 12px max(16px,env(safe-area-inset-bottom));background:#faf8f1f2;backdrop-filter:blur(16px);border-top:1px solid var(--line);display:flex;justify-content:center;gap:12px;z-index:5}.nav button{background:transparent;border-radius:18px;min-width:65px;padding:8px 12px;font-size:11px}.nav i{display:block;font-style:normal;font-size:21px;margin-bottom:4px}.nav .active{background:#e2eedb;color:var(--green)}.primary{background:var(--green);color:white;border-radius:16px;padding:14px 20px;font-weight:700}.secondary{background:#eff2e8;border-radius:16px;padding:14px 18px}.wide{width:100%}.empty{background:white;border:1px dashed #cdd9c2;text-align:center;padding:30px 18px;border-radius:24px;color:var(--muted)}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:16px 0}.calday{aspect-ratio:1;border-radius:12px;display:flex;align-items:center;justify-content:center;background:#fff;position:relative;font-size:13px}.calday.completed{background:#d9eacb}.calday.today{box-shadow:inset 0 0 0 2px var(--green)}.calday small{position:absolute;bottom:3px;font-size:8px}.card{background:white;border:1px solid var(--line);padding:20px;border-radius:24px;margin:15px 0}.entry{padding:18px;background:white;border:1px solid var(--line);border-radius:22px;margin:12px 0}.entry img{width:100%;max-height:280px;object-fit:cover;border-radius:14px;margin-top:12px}.entry p{font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}.badge{display:inline-block;background:#f7efda;padding:7px 11px;border-radius:12px;font-size:11px;margin:4px}.modal-bg{position:fixed;inset:0;background:#244a4070;z-index:20;display:flex;align-items:flex-end;justify-content:center}.sheet{width:100%;max-width:600px;max-height:92dvh;overflow:auto;background:var(--cream);padding:22px;border-radius:28px 28px 0 0;padding-bottom:30px}.sheet h2{margin:8px 0 18px}.field{margin:16px 0}.field label{display:block;font-size:12px;margin-bottom:8px;color:var(--muted)}input,textarea,select{width:100%;border:1px solid #dce3d5;border-radius:14px;padding:13px;background:white;color:var(--ink)}textarea{min-height:100px;resize:vertical}.choices{display:flex;gap:8px;flex-wrap:wrap}.choices button{padding:11px;border-radius:13px;background:white;font-size:22px;border:2px solid transparent}.choices .selected{border-color:var(--green);background:#e3efdb}.preview{max-height:150px;border-radius:15px;max-width:100%;margin:12px 0}.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);border-radius:18px;background:var(--ink);color:white;padding:13px 22px;z-index:50;width:max-content;max-width:90%;font-size:13px}.plant{text-align:center;background:#e2eedb;border-radius:28px;padding:30px}.plant svg{width:210px;height:210px}.progress{height:9px;background:#edf1e6;border-radius:8px;overflow:hidden;margin:16px 0}.progress div{height:100%;background:#86b581}.small{font-size:12px;color:var(--muted)}@media(min-width:600px){#app{padding:30px 40px 120px}.hero{min-height:220px}.mascot{width:210px;height:210px}.hero h2{font-size:28px}.habit{padding:24px}.modal-bg{align-items:center}.sheet{border-radius:28px}}
</style><div id="app"></div><nav class="nav" id="nav"></nav><div id="modal"></div><div id="toast"></div><script src="model.js"></script><script>
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let state, page='today',month=dayKey().slice(0,7),photo='',mood='😊',busy=false;
try{let raw=window.Native?Native.load():localStorage.getItem('sunny');state=raw?validate(JSON.parse(raw)):fresh()}catch(e){state=fresh()}
function save(){let raw=JSON.stringify(state);try{if(window.Native){if(!Native.save(raw))throw Error()}else localStorage.setItem('sunny',raw);return true}catch(e){toast('存储空间不足，请先导出备份');return false}}
function toast(s){$('#toast').innerHTML='<div class="toast">'+esc(s)+'</div>';setTimeout(()=>$('#toast').innerHTML='',3000)}
function mascot(){return `<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><ellipse cx="102" cy="181" rx="65" ry="10" fill="#cadcbb"/><path d="M101 114Q100 65 82 53" stroke="#519779" stroke-width="7" fill="none"/><path d="M95 83C53 83 45 44 56 38C88 35 105 58 95 83Z" fill="#84b77b"/><path d="M100 95C97 60 126 45 149 52C153 78 128 99 100 95Z" fill="#529b75"/><path d="M49 108Q99 89 150 108L138 171Q100 185 62 171Z" fill="#fff9e9"/><ellipse cx="77" cy="137" rx="4" ry="6" fill="#294b40"/><ellipse cx="123" cy="137" rx="4" ry="6" fill="#294b40"/><path d="M91 149Q100 159 109 149" fill="none" stroke="#294b40" stroke-width="3" stroke-linecap="round"/><ellipse cx="68" cy="148" rx="8" ry="4" fill="#efb5a1"/><ellipse cx="133" cy="148" rx="8" ry="4" fill="#efb5a1"/><path d="M164 36v14M157 43h14" stroke="#c9a756" stroke-width="3" stroke-linecap="round"/></svg>`}
function nav(){let tabs=[['today','☀','今天'],['calendar','▦','日历'],['journal','♡','日记'],['garden','♧','花园'],['settings','⚙','我的']];$('#nav').innerHTML=tabs.map(([id,icon,label])=>`<button onclick="navigate('${id}')" class="${page===id?'active':''}"><i>${icon}</i>${label}</button>`).join('')}
function navigate(p){page=p;render();window.scrollTo(0,0)}function goBack(){if($('#modal').innerHTML)closeModal();else navigate('today')}function closeModal(){if(busy){toast('照片处理中，请稍等');return}$('#modal').innerHTML='';photo=''}
function header(title,sub){return `<div class="brand"><div><div class="logo">晴芽<span style="font-size:18px"> 🌱</span></div><div class="eyebrow">SUNNY SPROUT</div></div><span class="date">${new Date().toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'short'})}</span></div><h1>${title}</h1><p class="sub">${sub}</p>`}
function render(){nav();const today=dayKey(),all=Object.values(state.entries),total=all.length;let html='';if(page==='today'){const done=all.filter(e=>e.date===today).length;html=header('让小习惯，慢慢发芽。','不必一下变得很厉害，今天迈出一小步就好。')+`<div class="hero"><h2>${done?'今天的你，闪闪发光。':'给未来的自己，\n浇一点点水。'}</h2><p>${done?`已经完成 ${done} 个习惯。每份努力，小芽都记得。`:'每一次小小的坚持，都是一片新叶子。'}</p><span class="pill">✦ ${total} 份成长记忆</span><div class="mascot">${mascot()}</div></div><div class="stats"><div class="stat"><b>${done}/${state.habits.length}</b><span>今日完成</span></div><div class="stat"><b>${bestCurrent(state)}</b><span>当前连续 · 天</span></div><div class="stat"><b>${total}</b><span>累计打卡 · 次</span></div></div><div class="row"><h2>我的小习惯 <span class="small">${state.habits.length}</span></h2><button class="link" onclick="editHabit()">＋ 新习惯</button></div>`;html+=state.habits.length?state.habits.map(h=>habitCard(h)).join(''):`<div class="empty">🌱<p>先种下一个小习惯吧<br>读一页书，或早睡十分钟。</p><button class="primary" onclick="editHabit()">种下第一个习惯</button></div>`;html+='<div class="quote">「 偶尔停下来，也不妨碍你继续生长。 」</div>'}
if(page==='calendar'){html=header('每一天，都留下痕迹。','绿色格子，是你认真生活的小小证据。')+`<div class="card"><div class="row"><button class="secondary" onclick="shiftMonth(-1)">‹</button><b>${month.replace('-',' 年 ')} 月</b><button class="secondary" onclick="shiftMonth(1)">›</button></div><div class="calendar">${['一','二','三','四','五','六','日'].map(s=>'<span class="small" style="text-align:center">'+s+'</span>').join('')}${calendarHTML()}</div><p class="small">点击日期，回看当天；也可以为过去的努力补记。</p></div>`}
if(page==='journal'){html=header('收藏普通日子的光。','照片、心情和一句话，组成你的成长日记。');html+=all.length?all.sort((a,b)=>b.date.localeCompare(a.date)).map(e=>entryCard(e)).join(''):'<div class="empty">📷<p>第一次打卡后，日记就会出现在这里。</p></div>'}
if(page==='garden'){let level=Math.floor(total/7),progress=total%7;html=header('你的坚持，正在开花。','一份打卡，一滴水。每七次打卡，长出一片新叶。')+`<div class="plant">${mascot()}<h2>${level<1?'刚刚发芽':level<3?'枝叶舒展':level<6?'郁郁葱葱':'繁花小树'} · Lv.${level+1}</h2><p class="small">已经收集 ${total} 滴成长露水</p><div class="progress"><div style="width:${progress/7*100}%"></div></div><span class="small">再打卡 ${7-progress} 次，就会长大一点点</span></div><h2>成长纪念章</h2>${[[1,'🌱','初次发芽'],[7,'🍃','七滴露水'],[30,'🌼','三十份坚持'],[100,'🌳','百日小森林']].map(([n,i,s])=>`<div class="badge" style="opacity:${total>=n?1:.4}">${i} ${s} · ${total>=n?'已点亮':n+'次'}</div>`).join('')}`}
if(page==='settings'){html=header('照顾好你的小花园。','习惯与照片只保存在这台设备，记得定期备份。')+`<div class="card"><h2 style="margin-top:0">数据与隐私</h2><p class="small">无需账号 · 无广告 · 无联网权限<br>卸载或清除应用数据会删除记录，备份包含照片。</p><button class="primary wide" onclick="exportData()">↗ 导出完整备份</button><button class="secondary wide" style="margin-top:10px" onclick="importStart()">↙ 导入备份</button><input type="file" id="backup" accept="application/json,.json" hidden onchange="readBackup(this)"></div><div class="card"><h2 style="margin-top:0">习惯管理</h2>${state.habits.map(h=>`<div class="row" style="padding:10px 0"><span>${esc(h.icon)} ${esc(h.name)}</span><button class="link" onclick="editHabit('${h.id}')">编辑</button></div>`).join('')||'<p class="small">还没有习惯</p>'}</div><div class="card"><b>晴芽 SunnySprout 1.0.0</b><p class="small">把生活过成一座温柔的小花园。<br>Android 原生容器 · 离线日记<br>提醒和云同步暂未提供。</p></div>`}$('#app').innerHTML=html}
function habitCard(h){let today=dayKey(),e=state.entries[h.id+'_'+today];return `<div class="habit"><div class="row"><div class="emoji">${esc(h.icon)}</div><div style="flex:1"><div class="habit-title">${esc(h.name)}</div><div class="meta">${esc(h.goal)} · 连续 ${streak(state,h.id,today)} 天</div></div><button aria-label="${e?'查看':'打卡'}${esc(h.name)}" class="check ${e?'checked':''}" onclick="checkin('${h.id}','${today}')">${e?'✓':'＋'}</button></div><div class="week">${Array.from({length:7},(_,i)=>{let d=offset(today,i-6),yes=state.entries[h.id+'_'+d];return `<div class="day">${['日','一','二','三','四','五','六'][parseDay(d).getDay()]}<div class="dot ${yes?'done':''}">${yes?'✓':parseDay(d).getDate()}</div></div>`}).join('')}</div></div>`}
function editHabit(id){let h=state.habits.find(x=>x.id===id)||{name:'',goal:'每天进步一点点',icon:'📖'};$('#modal').innerHTML=`<div class="modal-bg"><div class="sheet"><div class="row"><h2>${id?'照顾这个习惯':'种下一个小习惯'}</h2><button class="link" onclick="closeModal()">关闭</button></div><div class="field"><label>习惯名称（最多 30 字）</label><input id="hname" maxlength="30" placeholder="比如：每天读 10 页书" value="${esc(h.name)}"></div><div class="field"><label>每天的小目标</label><input id="hgoal" maxlength="60" value="${esc(h.goal)}"></div><div class="field"><label>挑一个可爱的图标</label><div class="choices" id="icons">${['📖','💧','🌙','🏃','✏️','🎨','🧘','🌱','💪','🎵','☀️','🍎'].map(i=>`<button class="${h.icon===i?'selected':''}" onclick="selectIcon(this)">${i}</button>`).join('')}</div></div><button class="primary wide" onclick="saveHabit('${id||''}')">${id?'保存修改':'让它开始生长'}</button>${id?`<button class="link wide" onclick="deleteHabit('${id}')">删除习惯及其记录</button>`:''}</div></div>`}
function selectIcon(el){$('#icons .selected')?.classList.remove('selected');el.classList.add('selected')}function saveHabit(id){let name=$('#hname').value.trim(),goal=$('#hgoal').value.trim(),icon=$('#icons .selected')?.textContent||'🌱';if(!name)return toast('给习惯起个名字吧');let prev=JSON.stringify(state),h=state.habits.find(x=>x.id===id);if(h)Object.assign(h,{name,goal,icon});else state.habits.push({id:'h'+Date.now(),name,goal,icon,created:dayKey()});if(save()){closeModal();render();toast('小习惯已种下 🌱')}else state=JSON.parse(prev)}function deleteHabit(id){if(!confirm('删除这个习惯和全部打卡照片？建议先导出备份。'))return;let prev=JSON.stringify(state);state.habits=state.habits.filter(h=>h.id!==id);Object.keys(state.entries).forEach(k=>{if(state.entries[k].habitId===id)delete state.entries[k]});if(save()){closeModal();render()}else state=JSON.parse(prev)}
function checkin(id,date){if(date>dayKey())return toast('未来还没到，先照顾好今天');let e=state.entries[id+'_'+date],h=state.habits.find(x=>x.id===id);if(!h)return;photo=e?.photo||'';mood=e?.mood||'😊';$('#modal').innerHTML=`<div class="modal-bg"><div class="sheet"><div class="row"><h2>${esc(h.icon)} ${esc(h.name)}</h2><button class="link" onclick="closeModal()">关闭</button></div><p class="sub">${date} · ${e?'这一天的努力已记下':'为今天的努力，留一点记忆'}</p><div class="field"><label>此刻的心情</label><div class="choices" id="moods">${['😊','🥰','😌','😴','😣'].map(i=>`<button class="${mood===i?'selected':''}" onclick="selectMood(this)">${i}</button>`).join('')}</div></div><div class="field"><label>今天想记些什么？（选填）</label><textarea id="note" maxlength="1000" placeholder="今天虽然有点累，但还是完成啦。">${esc(e?.note||'')}</textarea></div><input id="photo" type="file" accept="image/*" hidden onchange="loadPhoto(this)"><button class="secondary" onclick="document.querySelector('#photo').click()">📷 添加 / 更换照片</button><div id="photoPreview">${photo?`<img class="preview" src="${photo}"><button class="link" onclick="removePhoto()">移除照片</button>`:''}</div><button id="submitCheck" class="primary wide" onclick="saveCheck('${id}','${date}')">${e?'保存日记':'✓ 完成打卡，浇一滴水'}</button>${e?`<button class="link wide" onclick="undoCheck('${id}','${date}')">撤销这次打卡</button>`:''}</div></div>`}
function selectMood(el){$('#moods .selected')?.classList.remove('selected');el.classList.add('selected');mood=el.textContent}function removePhoto(){photo='';$('#photoPreview').innerHTML=''}
function loadPhoto(input){let f=input.files[0];if(!f)return;if(!f.type.startsWith('image/'))return toast('请选择图片文件');if(f.size>30*1024*1024)return toast('图片过大，请选择 30MB 以内的图片');busy=true;$('#submitCheck').disabled=true;const finish=()=>{busy=false;$('#submitCheck').disabled=false};let reader=new FileReader();reader.onerror=()=>{finish();toast('读取照片失败')};reader.onload=()=>{let img=new Image();img.onerror=()=>{finish();toast('这种图片暂时无法读取，请使用 JPG 或 PNG')};img.onload=()=>{try{let ratio=Math.min(1,1200/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*ratio);c.height=Math.round(img.height*ratio);let ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(img,0,0,c.width,c.height);photo=c.toDataURL('image/jpeg',.78);$('#photoPreview').innerHTML=`<img class="preview" src="${photo}"><button class="link" onclick="removePhoto()">移除照片</button>`}catch(e){toast('照片处理失败')}finish()};img.src=reader.result};reader.readAsDataURL(f)}
function saveCheck(id,date){if(busy)return;let prev=JSON.stringify(state),key=id+'_'+date,existed=!!state.entries[key];state.entries[key]={habitId:id,date,note:$('#note').value,mood,photo};if(save()){closeModal();render();if(window.Native)Native.haptic();toast(existed?'日记已更新 ♡':'打卡成功，小芽长大了一点 🌱')}else state=JSON.parse(prev)}function undoCheck(id,date){if(!confirm('撤销这次打卡？日记和照片也会删除。'))return;let prev=JSON.stringify(state);delete state.entries[id+'_'+date];if(save()){closeModal();render()}else state=JSON.parse(prev)}
function shiftMonth(n){let d=parseDay(month+'-01');d.setMonth(d.getMonth()+n);month=dayKey(d).slice(0,7);render()}function calendarHTML(){let first=parseDay(month+'-01'),n=new Date(first.getFullYear(),first.getMonth()+1,0).getDate(),pad=(first.getDay()+6)%7;return '<span></span>'.repeat(pad)+Array.from({length:n},(_,i)=>{let date=month+'-'+String(i+1).padStart(2,'0'),count=Object.values(state.entries).filter(e=>e.date===date).length;return `<button class="calday ${count?'completed':''} ${date===dayKey()?'today':''}" onclick="dayDetail('${date}')">${i+1}${count?'<small>'+count+'次</small>':''}</button>`}).join('')}
function dayDetail(date){$('#modal').innerHTML=`<div class="modal-bg"><div class="sheet"><div class="row"><h2>${date}</h2><button class="link" onclick="closeModal()">关闭</button></div>${date>dayKey()?'<p class="small">这一天还没到，期待未来的小小进步。</p>':state.habits.map(h=>`<div class="row card"><span>${esc(h.icon)} ${esc(h.name)}</span><button class="link" onclick="checkin('${h.id}','${date}')">${state.entries[h.id+'_'+date]?'查看日记':'补记'}</button></div>`).join('')||'<p>先创建一个习惯吧。</p>'}</div></div>`}
function entryCard(e){let h=state.habits.find(h=>h.id===e.habitId);return `<div class="entry"><div class="row"><b>${esc(h?.icon||'🌱')} ${esc(h?.name||'小习惯')}</b><button class="link" onclick="checkin('${e.habitId}','${e.date}')">编辑</button></div><div class="meta">${e.date} · ${esc(e.mood)}</div>${e.note?'<p>'+esc(e.note)+'</p>':''}${e.photo?'<img alt="打卡照片" loading="lazy" src="'+e.photo+'">':''}</div>`}
function exportData(){let raw=JSON.stringify(state,null,2);if(window.Native)Native.exportBackup(raw);else{let url=URL.createObjectURL(new Blob([raw],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='SunnySprout-'+dayKey()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),5000)}}function importStart(){if(window.Native)Native.importBackup();else $('#backup').click()}function readBackup(el){let f=el.files[0];if(!f)return;if(f.size>32*1024*1024)return toast('备份不得超过 32MB');let r=new FileReader();r.onload=()=>importData(r.result);r.readAsText(f)}function importData(raw){try{let incoming=validate(JSON.parse(raw));if(!confirm(`导入 ${incoming.habits.length} 个习惯和 ${Object.keys(incoming.entries).length} 条记录？这会替换当前数据，请先备份。`))return;let old=state;state=incoming;if(save()){closeModal();render();toast('花园已恢复 🌱')}else state=old}catch(e){toast('文件格式不正确，未修改当前数据')}}
setInterval(()=>{if(!$('#modal').innerHTML)render()},60000);render();
</script></html>
